<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="restoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1E24" />
      <stop offset="100%" stop-color="#0E0E10" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#2D2D35" stroke-width="6" />

  <!-- Cloche / Chef Dome Motif -->
  <g transform="translate(256, 230)">
    <!-- Top Handle Knob -->
    <circle cx="0" cy="-110" r="22" fill="url(#restoGrad)" />
    <path d="M-6,-92 L6,-92 L10,-70 L-10,-70 Z" fill="url(#restoGrad)" />
    
    <!-- Dome Cover -->
    <path d="M-150,40 C-150,-70 -90,-80 0,-80 C90,-80 150,-70 150,40 Z" fill="url(#restoGrad)" opacity="0.95" />
    
    <!-- Base Plate Rim -->
    <rect x="-175" y="45" width="350" height="26" rx="13" fill="#FFFFFF" opacity="0.9" />
    <rect x="-195" y="74" width="390" height="10" rx="5" fill="#EF4444" />
    
    <!-- Stylized Utensils Cutout or Flame -->
    <path d="M0,-50 C-20,-20 -15,10 0,25 C15,10 20,-20 0,-50 Z" fill="#FFFFFF" opacity="0.85" />
    <circle cx="0" cy="5" r="8" fill="#DC2626" />
  </g>

  <!-- Tagline RESTO-DZ Badge -->
  <g transform="translate(256, 420)">
    <rect x="-130" y="-32" width="260" height="48" rx="24" fill="#1C1C22" stroke="#EF4444" stroke-width="3" />
    <text x="0" y="2" font-family="Plus Jakarta Sans, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">RESTO·DZ</text>
  </g>
</svg>
